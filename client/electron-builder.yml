appId: com.tidemind.app
productName: Tide Mind
directories:
  buildResources: resources
  output: release

# 显式指定 artifact 名字，解决 electron-builder 对带空格的 productName 处理
# 不一致的老 bug：上传到 GitHub Releases 的 asset 用 "Tide.Mind-"（点号），
# 但自动生成的 latest-mac.yml 里的 url 用 "Tide-Mind-"（横线），导致
# electron-updater 按 yml 去拉时 404。写死 artifactName 让两边永远一致。
artifactName: Tide.Mind-${version}-${arch}.${ext}

# Auto-update: GitHub Releases（签名后启用 electron-updater）
publish:
  provider: github
  owner: SawyerHan-AI
  repo: TideMind

protocols:
  - name: TideMind
    schemes:
      - tidemind

mac:
  category: public.app-category.productivity
  icon: resources/icon.icns
  # 架构由release matrix显式传入--x64/--arm64；这里不得再次展开双架构，
  # 否则单一原生runner会为另一架构产出带错native modules的伪资产。
  target:
    - target: dmg
    - target: zip
  hardenedRuntime: true
  # Hardened Runtime entitlements:
  #   - entitlements (main app): 含 keychain-access-groups / Apple Events 等
  #     需要 provisioning profile 授权的 capability,只给 main app 用
  #   - entitlementsInherit (helper): **必须**是单独一份精简 entitlement,
  #     **不得**含任何需要 provisioning profile 授权的 capability,否则
  #     helper 进程启动时 macOS 校验 entitlement vs profile 失败 → SIGKILL
  #     (v0.2.70 事故根因,2026-05-20 修)。详见 entitlements.mac.inherit.plist
  #     和 docs/claude-guides/release-checklist.md §helper-entitlements-trap。
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  # Notarize:启用 Apple 公证。需要 env APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
  # APPLE_TEAM_ID 注入(看 .github/workflows/release.yml)。
  # 这三个 env 缺一不可。普通本地candidate构建可以不注入，但公开Release workflow
  # 会在打包前fail closed，并在上传前逐架构验证签名、公证、staple和Gatekeeper。
  notarize: true
  # Developer ID provisioning profile,签名时 @electron/osx-sign 会复制到
  # Contents/embedded.provisionprofile,授权 entitlements.mac.plist 里的
  # keychain-access-groups。**没有这个 profile,Data Protection Keychain 无法启用,
  # 启动后会 fallback 到强制重登路径**(secure-store.ts isAvailable 返回 false)。
  # 详见 docs/design/keychain-prompt-elimination-2026-05-20.md §4.2。
  provisioningProfile: resources/embedded.provisionprofile
  # Gatekeeper assess 在 GitHub Actions runner 上必失败(没装证书 keychain 时),
  # 设 false 跳过让 build 通过 — 真正的 gatekeeper 验证在用户机器装 app 时跑。
  gatekeeperAssess: false

dmg:
  # Gatekeeper assesses the outermost distribution container. Sign the DMG
  # with the same Developer ID identity before the workflow notarizes/staples it.
  sign: true
  title: Tide Mind
  iconSize: 80
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

asar: true
asarUnpack:
  - "**/*.node"
  - "**/*.dylib"
  - "**/better-sqlite3/**"
  - "**/sqlite-vec*/**"
  # better-sqlite3 的 transitive 运行时依赖。native module 加载链路：
  #   better-sqlite3/lib/database.js → require('bindings')('better_sqlite3.node')
  #   bindings → require('file-uri-to-path')
  # mcp-server.cjs 是通过 /bin/sh 启动的普通 node 进程（非 Electron），
  # 看不到 asar 虚拟文件系统，必须把这条依赖链全部 unpack 到真实文件。
  # 漏掉任何一个都会让打包后的 MCP server 在首次访问数据库时崩溃。
  - "**/bindings/**"
  - "**/file-uri-to-path/**"
  # bundled 的 hook-session-start.cjs / mcp-server.cjs 必须 unpack：
  # 外部 Agent 通过 /bin/sh 启动 hook 时，shell 看不到 asar 内部，
  # 需要真实的 OS 文件路径。
  - "out/bin/**"

extraResources:
  # 长期Worker由真实OS文件路径启动，external native模块的JS加载链也必须位于
  # app.asar.unpacked；只unpack *.node/*.dylib不足以让Node解析bindings和架构包。
  - from: "node_modules"
    to: "app.asar.unpacked/node_modules"
    filter:
      - "bindings/**/*"
      - "file-uri-to-path/**/*"
      - "sqlite-vec*/**/*"
  - from: "../data"
    to: "data"
    filter:
      - "**/*"
      - "!*.sqlite"
      - "!*.sqlite-wal"
      - "!*.sqlite-shm"
      - "!*.sqlite-journal"
      # 手动备份文件和通用 .bak 不应进 DMG(历史踩坑:曾漏过滤)
      - "!*.sqlite.bak*"
      - "!*.bak*"

files:
  - "out/**/*"
  - "resources/**/*"
  - "!node_modules/**/{test,tests,__tests__,__mocks__}/**"
  - "!node_modules/**/*.{md,ts,map}"
  - "!node_modules/**/{example,examples,demo,docs}/**"
