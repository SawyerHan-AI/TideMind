appId: com.tidemind.app
productName: Tide Mind
directories:
  buildResources: resources
  output: release

# 显式指定 artifact 名字，解决 electron-builder 对带空格的 productName 处理
# 不一致的老 bug：上传到 GitHub Releases 的 asset 用 "Tide.Mind-"（点号），
# 但自动生成的 latest-mac.yml 里的 url 用 "Tide-Mind-"（横线），导致
# electron-updater 按 yml 去拉时 404。写死 artifactName 让两边永远一致。
artifactName: Tide.Mind-${version}-${arch}.${ext}

# Auto-update: GitHub Releases（签名后启用 electron-updater）
publish:
  provider: github
  owner: SawyerHan-AI
  repo: TideMind

protocols:
  - name: TideMind
    schemes:
      - tidemind

mac:
  category: public.app-category.productivity
  icon: resources/icon.icns
  # 显式声明双架构:Intel(x64) + Apple Silicon(arm64)。
  # 不写 arch 时 electron-builder 只打 host arch(macos-latest runner 是 arm64),
  # Intel Mac 用户从 Release 下到的 DMG 会启动失败。
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  hardenedRuntime: true
  # Hardened Runtime entitlements:V8 JIT / native module dlopen / 网络访问。
  # 不加这些,签名后的 app 启动时会被 macOS Hardened Runtime 限制崩溃。
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # Notarize:启用 Apple 公证。需要 env APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
  # APPLE_TEAM_ID 注入(看 .github/workflows/release.yml)。
  # 这三个 env 缺一不可 — 缺失时 electron-builder 会跳过公证但仍签名(可接受降级)。
  # 如果连 CSC_LINK(证书)也没设,会跳过整个签名流程(等于今天行为)。
  notarize: true
  # Gatekeeper assess 在 GitHub Actions runner 上必失败(没装证书 keychain 时),
  # 设 false 跳过让 build 通过 — 真正的 gatekeeper 验证在用户机器装 app 时跑。
  gatekeeperAssess: false

dmg:
  title: Tide Mind
  iconSize: 80
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

asar: true
asarUnpack:
  - "**/*.node"
  - "**/*.dylib"
  - "**/better-sqlite3/**"
  - "**/sqlite-vec*/**"
  # better-sqlite3 的 transitive 运行时依赖。native module 加载链路：
  #   better-sqlite3/lib/database.js → require('bindings')('better_sqlite3.node')
  #   bindings → require('file-uri-to-path')
  # mcp-server.cjs 是通过 /bin/sh 启动的普通 node 进程（非 Electron），
  # 看不到 asar 虚拟文件系统，必须把这条依赖链全部 unpack 到真实文件。
  # 漏掉任何一个都会让打包后的 MCP server 在首次访问数据库时崩溃。
  - "**/bindings/**"
  - "**/file-uri-to-path/**"
  # bundled 的 hook-session-start.cjs / mcp-server.cjs 必须 unpack：
  # 外部 Agent 通过 /bin/sh 启动 hook 时，shell 看不到 asar 内部，
  # 需要真实的 OS 文件路径。
  - "out/bin/**"

extraResources:
  - from: "../data"
    to: "data"
    filter:
      - "**/*"
      - "!*.sqlite"
      - "!*.sqlite-wal"
      - "!*.sqlite-shm"
      - "!*.sqlite-journal"
      # 手动备份文件和通用 .bak 不应进 DMG(历史踩坑:曾漏过滤)
      - "!*.sqlite.bak*"
      - "!*.bak*"

files:
  - "out/**/*"
  - "resources/**/*"
  - "!node_modules/**/{test,tests,__tests__,__mocks__}/**"
  - "!node_modules/**/*.{md,ts,map}"
  - "!node_modules/**/{example,examples,demo,docs}/**"
