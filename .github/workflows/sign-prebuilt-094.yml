name: Sign prebuilt 0.2.94
run-name: Sign prebuilt 0.2.94 b154
on:
  workflow_dispatch:
    inputs:
      archive_sha256:
        required: true
        type: string
permissions:
  contents: write
jobs:
  sign:
    runs-on: macos-26-intel
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_COMMIT: b15463bbb852d910d4ce1c64da63b3a5812d9444
      TRANSFER_TAG: internal-signing-0.2.94-b15463bbb852
      ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Fetch the native ARM64 build
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = SawyerHan-AI/TideMind ]
          [ "$RUNNER_OS" = macOS ]
          [ "$RUNNER_ARCH" = X64 ]
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          mkdir "$RUNNER_TEMP/input" "$RUNNER_TEMP/app"
          gh release download "$TRANSFER_TAG" --pattern TideMind-0.2.94-b154-unsigned-app.zip --dir "$RUNNER_TEMP/input"
          echo "$ARCHIVE_SHA256  $RUNNER_TEMP/input/TideMind-0.2.94-b154-unsigned-app.zip" | shasum -a 256 -c -
          ditto -xk "$RUNNER_TEMP/input/TideMind-0.2.94-b154-unsigned-app.zip" "$RUNNER_TEMP/app"
          echo "SIGN_APP=$RUNNER_TEMP/app/Tide Mind.app" >> "$GITHUB_ENV"
          test "$(lipo -archs "$RUNNER_TEMP/app/Tide Mind.app/Contents/MacOS/Tide Mind")" = arm64
      - name: Install existing packaging tools only
        run: |
          npm ci --ignore-scripts
          npm --prefix client ci --ignore-scripts
      - name: Import existing CI signing identity
        shell: bash
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$MAC_CERTIFICATE" ] && [ -n "$MAC_CERTIFICATE_PASSWORD" ]
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"
          keychain="$RUNNER_TEMP/tidemind-signing.keychain-db"
          printf '%s' "$MAC_CERTIFICATE" | base64 -D > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application:.*Z4U232GXH5/ {print $2}')"
          [[ "$identity" =~ ^[0-9A-Fa-f]{40}$ ]]
          echo "SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Sign the prebuilt app without rebuilding it
        working-directory: client
        run: |
          node <<'JS'
          const fs = require('node:fs'); const path = require('node:path');
          const { signAsync } = require('@electron/osx-sign');
          const app = process.env.SIGN_APP;
          const provenance = JSON.parse(fs.readFileSync(path.join(app,'Contents/Resources/app.asar.unpacked/out/bin/build-provenance.json')));
          if (provenance.sourceCommit !== process.env.SOURCE_COMMIT || provenance.appVersion !== '0.2.94') throw Error('wrong prebuilt source');
          signAsync({app, platform:'darwin', type:'distribution', identity:process.env.SIGN_IDENTITY,
            version:require('electron/package.json').version, gatekeeperAssess:false,
            keychain:process.env.SIGN_KEYCHAIN, provisioningProfile:path.resolve('resources/embedded.provisionprofile'),
            optionsForFile:file=>({hardenedRuntime:true,entitlements:path.resolve(file===app?'resources/entitlements.mac.plist':'resources/entitlements.mac.inherit.plist')})
          }).catch(error=>{console.error(error.message);process.exitCode=1});
          JS
      - name: Use existing Apple ticket TCP workaround
        run: |
          sudo pfctl -sr | grep -Fq 'anchor "com.apple/*"'
          printf '%s\n' 'block return out quick proto udp from any to any port 443' | sudo pfctl -a com.apple/tidemind-ticket-tcp -f -
          sudo pfctl -E
      - name: Notarize and staple the app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          [ "$APPLE_TEAM_ID" = Z4U232GXH5 ]
          ditto -c -k --sequesterRsrc --keepParent "$SIGN_APP" "$RUNNER_TEMP/app-for-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app-for-notary.zip" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          bash .github/scripts/retry-apple-ticket.sh xcrun stapler staple "$SIGN_APP"
      - name: Package the signed ARM64 app
        working-directory: client
        env:
          CSC_NAME: ${{ env.SIGN_IDENTITY }}
          CSC_KEYCHAIN: ${{ env.SIGN_KEYCHAIN }}
        run: node_modules/.bin/electron-builder --mac --arm64 --prepackaged "$SIGN_APP" --publish never
      - name: Notarize DMG and verify signed containers
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool submit client/release/Tide.Mind-0.2.94-arm64.dmg --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          bash .github/scripts/retry-apple-ticket.sh xcrun stapler staple client/release/Tide.Mind-0.2.94-arm64.dmg
          node scripts/refresh-mac-dmg-update-metadata.mjs --release-dir client/release --arch arm64 --version 0.2.94
          node scripts/verify-mac-release-assets.mjs --private-rc-candidate --release-dir client/release --app "$SIGN_APP" --arch arm64 --source-commit "$SOURCE_COMMIT" --receipt client/release/candidate-verification.json
          mv client/release/latest-mac.yml client/release/latest-mac-arm64.yml
          ditto -c -k --sequesterRsrc --keepParent "$SIGN_APP" client/release/Tide.Mind-0.2.94-arm64-stapled-app.zip
          cd client/release
          shasum -a 256 Tide.Mind-0.2.94-arm64.dmg Tide.Mind-0.2.94-arm64.dmg.blockmap Tide.Mind-0.2.94-arm64.zip Tide.Mind-0.2.94-arm64-stapled-app.zip candidate-verification.json latest-mac-arm64.yml > files.sha256
      - name: Save signed outputs to the same private draft
        run: |
          gh release upload "$TRANSFER_TAG" client/release/Tide.Mind-0.2.94-arm64.dmg client/release/Tide.Mind-0.2.94-arm64.dmg.blockmap client/release/Tide.Mind-0.2.94-arm64.zip client/release/Tide.Mind-0.2.94-arm64-stapled-app.zip client/release/candidate-verification.json client/release/latest-mac-arm64.yml client/release/files.sha256
      - name: Remove temporary signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/tidemind-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12"
