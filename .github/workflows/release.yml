name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      # macOS 打包配置 sanity check(2026-05-21 v0.2.72 audit C HIGH-1 修复)。
      # 必须在 client build 之前跑,防止 helper entitlement 错误进入 build → 用户启动 SIGKILL。
      # 跟 release.mjs / health-check.mjs / .github/workflows/ci.yml 共用同一个脚本。
      # release.yml 跑在 macos-latest,plutil 可用,可以完整校验 plist 内容。
      - name: Check mac packaging
        run: node scripts/check-mac-packaging.mjs

      - name: Build core engine
        run: npm run build

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Build client
        run: cd client && npm run build

      # 打包 macOS:x64 + arm64 双架构。
      # Code signing + notarize 由 env 控制:
      #   - 没设 secrets 时:electron-builder 跳过签名 + 跳过公证,产出无签名 DMG
      #     (用户下载装 app 会弹"无法打开,身份不明的开发者",需手动右键打开)
      #   - 设了 5 个 secrets 时:自动签名 + 公证(Apple 服务器审核 ~2-5 分钟)
      #
      # 需要设的 GitHub Secrets(全部缺一不可,缺其中任一会降级到无签名):
      #   MAC_CERTIFICATE                  Developer ID Application .p12 文件的 base64
      #                                    (本地 openssl base64 -i cert.p12 | pbcopy)
      #   MAC_CERTIFICATE_PASSWORD         导出 .p12 时设的密码
      #   APPLE_ID                         Apple Developer 账号邮箱
      #   APPLE_APP_SPECIFIC_PASSWORD      App-specific password(在 appleid.apple.com 生成)
      #   APPLE_TEAM_ID                    10 字符 Team ID(在 developer.apple.com Membership 看)
      #
      # 详细配置步骤见 SECURITY.md §Apple Code Signing。
      - name: Package macOS
        run: cd client && npx electron-builder --mac --x64 --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # 上传到 GitHub Release
      #
      # generate_release_notes 必须是 false:release-checklist 要求手写
      # Release Notes,防 auto-generated 把 sync commit message 里意外泄露
      # 闭源信息(pro/ 下的内容)发布出去。发版后由人(或 Claude)用
      # `gh release edit --notes-file` 写正式 notes。
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            client/release/*.dmg
            client/release/*.zip
            client/release/*.blockmap
            client/release/latest-mac.yml
          draft: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
