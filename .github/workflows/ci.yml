name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      # Linux CI only needs the client dependency graph for shared tests/builds.
      # The production-only secure-store-mac package correctly rejects Linux,
      # so bypass platform checks without running any native install scripts.
      - run: cd client && npm ci --force --ignore-scripts
      - run: npm run build
      - run: npm test

      - name: Security audit
        run: npm audit --audit-level=high || true
