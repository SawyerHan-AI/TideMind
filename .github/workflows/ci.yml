name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Prepare private job temp
        shell: bash
        run: |
          set -euo pipefail
          job_temp="$(mktemp -d "$RUNNER_TEMP/tidemind-linux-job.XXXXXX")"
          printf 'TIDEMIND_CI_JOB_TEMP=%s\nTMPDIR=%s\n' "$job_temp" "$job_temp" >> "$GITHUB_ENV"

      - run: npm ci
      # Linux CI only needs the client dependency graph for shared tests/builds.
      # The production-only secure-store-mac package correctly rejects Linux,
      # so bypass platform checks without running any native install scripts.
      - run: cd client && npm ci --force --ignore-scripts
      # Tests import Electron and assert the generated Worker bundle. Restore
      # their runtime artifacts explicitly after suppressing package scripts.
      - run: cd client && node node_modules/electron/install.js
      - name: Verify Electron runtime before root tests
        run: |
          ldd client/node_modules/electron/dist/electron
          ELECTRON_RUN_AS_NODE=1 client/node_modules/electron/dist/electron -e 'if (!process.versions.electron) process.exit(1); console.log(process.versions)'
      # Kimi production tests launch client Electron, whose SQLite ABI differs
      # from root Node. Rebuild only client SQLite; keep Darwin scripts disabled.
      - name: Rebuild client SQLite for Electron
        run: |
          cd client
          ELECTRON_RUN_AS_NODE=1 node_modules/electron/dist/electron node_modules/@electron/rebuild/lib/cli.js --force --only better-sqlite3 --module-dir .
          ELECTRON_RUN_AS_NODE=1 node_modules/electron/dist/electron -e 'const db = new (require("better-sqlite3"))(":memory:"); if (db.prepare("SELECT 1 AS ok").get().ok !== 1) process.exit(1); db.close()'
      - name: Verify root SQLite retains Node ABI
        run: node -e 'const db = new (require("better-sqlite3"))(":memory:"); if (db.prepare("SELECT 1 AS ok").get().ok !== 1) process.exit(1); db.close()'
      - run: npm run build
      - run: cd client && npm run build:bin
      - run: npm test

      - name: Security audit
        run: npm audit --audit-level=high || true

  # Temporary diagnostic branch only. Do not merge this job into main.
  diagnose-writer-latency:
    if: github.head_ref == 'codex/diagnose-094-writer-latency' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: 'npm'
      - name: Confirm comparable hosted hardware
        run: |
          node - <<'NODE'
          const os = require('node:os');
          const machine = { arch: process.arch, cores: os.cpus().length, memoryBytes: os.totalmem() };
          console.log(JSON.stringify(machine));
          if (machine.arch !== 'arm64' || machine.cores !== 3 || machine.memoryBytes !== 7516192768) {
            throw new Error('Diagnostic requires the same 3-core 7GiB runner class as the failed candidate');
          }
          NODE
      - run: npm ci
      - run: npm run build
      - run: cd client && npm ci
      - run: node client/node_modules/electron/install.js
      - run: npm --prefix client run build
      - name: Diagnose packaged writer latency without signing or publication
        run: npm run measure:metabolism:packaged
