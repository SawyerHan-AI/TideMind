description = "把当前对话中的关键信息存入 Tide Mind 外脑"
prompt = """
请使用 brain_digest 工具（Tide Mind MCP server，工具名形如 mcp__tidemind__brain_digest）把本轮对话中值得记住的信息保存到外脑。

聚焦主题：{{args}}（如为空则覆盖整轮对话的要点）

值得 digest 的内容：
- 用户的决策、偏好、观点、态度
- 讨论中产生的洞察、结论、新认知
- 被否定的方案及其原因
- 用户的习惯、风格、关注点

执行步骤：
1. content 用 Markdown 格式，聚焦单一主题（多个主题分多次 digest）
2. title 用清晰的主题名
3. context 写"为什么这条信息值得记住"——这决定了未来检索质量
4. source.tool 填 "gemini"
5. digest 完成后向用户简短确认"已记到外脑"，并说明记了什么主题
"""
